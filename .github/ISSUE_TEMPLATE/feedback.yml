name: Feedback
description: Tell us what happened when you used tk
title: "Feedback: "
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: |
        This is a usage report, not a build ticket and not a promise that a tool will be added. Say what you ran and what happened.
        A broken command belongs in the bug report. A capability you want added belongs in a proposal. Open design talk belongs in [Ideas](https://github.com/ASabale/agent-toolkit/discussions/new?category=ideas).
        Agents working on this repo read open `feedback` issues ([FEEDBACK.md](https://github.com/ASabale/agent-toolkit/blob/main/FEEDBACK.md)). They keep a report only when it fits [VISION.md](https://github.com/ASabale/agent-toolkit/blob/main/VISION.md) (easy to use, easy to extend, easy to maintain). A report that adds token bloat, a second command grammar, or a tool nobody has needed is closed. The original report stays in the issue.

  - type: textarea
    id: tried
    attributes:
      label: What you were trying to do
      description: The task, in one or two sentences.
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: What you ran
      description: The tk command or the MCP call. Paste the error if there was one.

  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: What the tool printed, or where you got stuck.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What would have finished the task
      description: Optional. Do not design a new tool. The agents will decide if this fits the vision.

  - type: input
    id: context
    attributes:
      label: Context
      description: Optional. Harness and tk version, if you know them. Placeholder text is fine.
