name: ci

on:
  push:
  pull_request:

jobs:
  tests:
    name: tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Catalog check
        run: |
          export TK_NO_TELEMETRY=1
          ./tk check --json
      - name: Historical wiki lint
        run: |
          export TK_NO_TELEMETRY=1
          python3 -c 'import json, subprocess, sys; r = json.loads(subprocess.check_output(["./tk", "run", "wiki.lint", "--path", "wiki"])); sys.exit(0 if r.get("ok") else 1)'
      - name: Unit and token budget tests
        run: |
          export TK_STATE_DIR="$(mktemp -d)"
          python3 -m unittest discover -s tests -v
        env:
          TK_NO_TELEMETRY: "1"

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint shell scripts
        run: |
          set -eu
          files=()
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            case "$(head -n1 "$f")" in
              '#!/bin/sh'|'#!/bin/bash'|'#!/usr/bin/env sh'|'#!/usr/bin/env bash')
                files+=("$f")
                ;;
            esac
          done < <(git ls-files)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No shell scripts found"
            exit 0
          fi
          printf 'Checking %s\n' "${files[@]}"
          shellcheck "${files[@]}"

  test:
    name: test
    if: always()
    needs: [tests, shellcheck]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs succeeded
        env:
          TESTS: ${{ needs.tests.result }}
          SHELLCHECK: ${{ needs.shellcheck.result }}
        run: |
          echo "tests=${TESTS} shellcheck=${SHELLCHECK}"
          [ "$TESTS" = success ] && [ "$SHELLCHECK" = success ]
