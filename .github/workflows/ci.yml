name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Catalog check
        run: |
          export TK_NO_TELEMETRY=1
          ./tk check --json
      - name: Historical wiki lint
        run: |
          export TK_NO_TELEMETRY=1
          python3 -c 'import json, subprocess, sys; r = json.loads(subprocess.check_output(["./tk", "run", "wiki.lint", "--path", "wiki"])); sys.exit(0 if r.get("ok") else 1)'
      - name: Unit and token budget tests
        run: |
          export TK_STATE_DIR="$(mktemp -d)"
          python3 -m unittest discover -s tests -v
        env:
          TK_NO_TELEMETRY: "1"

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint shell scripts
        run: |
          set -eu
          files=()
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            case "$(head -n1 "$f")" in
              '#!/bin/sh'|'#!/bin/bash'|'#!/usr/bin/env sh'|'#!/usr/bin/env bash')
                files+=("$f")
                ;;
            esac
          done < <(git ls-files)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No shell scripts found"
            exit 0
          fi
          printf 'Checking %s\n' "${files[@]}"
          # Excludes (do not edit tool/install/hook files from this issue):
          # SC1007 — `CDPATH= cd -- ...` empty-assignment idiom in install.sh and .githooks/pre-commit
          # SC2059 — intentional printf format for octal JSON escaping in install.sh
          shellcheck --exclude=SC1007,SC2059 "${files[@]}"
